name: todo-readme-sync-temp
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Commit and push the generated README update
        type: boolean
        default: false
  push:
    paths:
      - .github/workflows/todo-readme-sync-temp.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Extract TODOs and update README
        env:
          APPLY: ${{ github.event_name == 'workflow_dispatch' && inputs.apply == true }}
        run: |
          cat > /tmp/sync_todo_readme.py <<'PY'
          from __future__ import annotations
          import difflib, os, re, subprocess, sys
          from collections import defaultdict
          from pathlib import Path

          ROOT = Path(os.environ.get("GITHUB_WORKSPACE", ".")).resolve()
          README = ROOT / "README.md"
          TITLE = "### 📝 Complete TODO List"
          APPLY = os.environ.get("APPLY", "false").lower() == "true"
          ENTRY_RE = re.compile(r"^- \[ \] \*\*(?P<path>.+?):(?P<line>\d+)\*\* - (?P<message>.*)$")

          def git(*args, check=True):
              p = subprocess.run(["git", *args], cwd=ROOT, text=True,
                                 capture_output=True, check=check)
              return p.stdout.strip()

          def scan_file(path: Path):
              out = []
              text = path.read_text(encoding="utf-8")
              for n, line in enumerate(text.splitlines(), 1):
                  pos = line.find("TODO")
                  if pos < 0:
                      continue
                  msg = line[pos + 4:]
                  msg = re.sub(r"^\s*:\s*|^\s+", "", msg, count=1).rstrip()
                  out.append((path.relative_to(ROOT).as_posix(), n, msg))
              return out

          def scan_all():
              entries = []
              for dirpath, dirnames, filenames in os.walk(ROOT):
                  dirnames[:] = [d for d in dirnames if d != ".git"]
                  for name in sorted(filenames):
                      if name.endswith(".py"):
                          entries.extend(scan_file(Path(dirpath) / name))
              return entries

          raw = README.read_text(encoding="utf-8")
          lines = raw.splitlines()
          hits = [i for i, x in enumerate(lines) if x == TITLE]
          assert len(hits) == 1, f"title count={len(hits)}"
          h = hits[0]
          end = next(i for i in range(h + 1, len(lines)) if lines[i].startswith("#"))
          old = []
          for i in range(h + 1, end):
              if not lines[i].strip():
                  continue
              m = ENTRY_RE.match(lines[i])
              assert m, f"bad line {i+1}: {lines[i]!r}"
              old.append((m.group("path"), int(m.group("line")), m.group("message")))
          print(f"APPLY={APPLY}; old README entries={len(old)}")

          git("fetch", "--no-tags", "origin",
              "+refs/heads/main:refs/remotes/origin/main",
              "+refs/heads/dev:refs/remotes/origin/dev")
          changed = [p for p in git("diff", "--name-only",
                                   "origin/main...origin/dev").splitlines()
                     if p.endswith(".py")]
          changed_set = set(changed)
          print("changed Python files:", changed)

          scanned = scan_all()
          scanned_by_path = defaultdict(list)
          for e in scanned:
              scanned_by_path[e[0]].append((e[1], e[2]))
          changed_entries = []
          for p in sorted(changed_set):
              changed_entries.extend([(p, n, m) for n, m in scanned_by_path.get(p, [])])

          new_entries = [e for e in old if e[0] not in changed_set] + changed_entries
          new_entries.sort(key=lambda e: (e[0], e[1]))
          groups = defaultdict(list)
          for p, n, m in new_entries:
              groups[p].append(n)
          assert all(v == sorted(v) for v in groups.values()), "line ordering violated"
          assert sum(p == TITLE for p in lines) == 1

          old_set, new_set = set(old), set(new_entries)
          print(f"new README entries={len(new_entries)}")
          print("REMOVED:")
          for e in sorted(old_set - new_set):
              print("  - [ ] **%s:%d** - %s" % e)
          print("ADDED/CHANGED:")
          for e in sorted(new_set - old_set):
              print("  + [ ] **%s:%d** - %s" % e)
          for p in changed:
              print(f"CURRENT {p}:")
              for n, m in scanned_by_path.get(p, []):
                  print(f"  L{n}: {m}")

          old_by_path = defaultdict(list)
          scan_by_path = defaultdict(list)
          for p, n, m in old:
              old_by_path[p].append((n, m))
          for p, vals in scanned_by_path.items():
              scan_by_path[p] = vals
          mismatch = []
          for p in sorted(set(old_by_path) | set(scan_by_path)):
              if p not in changed_set and old_by_path[p] != scan_by_path.get(p, []):
                  mismatch.append(p)
          print(f"unchanged-file scan mismatches={len(mismatch)}")
          for p in mismatch[:30]:
              print("MISMATCH", p, "README=", old_by_path[p][:8], "SCAN=", scan_by_path.get(p, [])[:8])

          head = "\n".join(lines[:h + 1])
          tail = "\n".join(lines[end:])
          body = "\n\n" + "\n".join("- [ ] **%s:%d** - %s" % e for e in new_entries) + "\n\n"
          updated = head + body + tail + ("\n" if raw.endswith("\n") else "")
          diff = list(difflib.unified_diff(raw.splitlines(), updated.splitlines(),
                                           "a/README.md", "b/README.md", lineterm=""))
          print("DIFF START")
          for d in diff:
              print(d)
          print("DIFF END")
          assert TITLE in updated

          if APPLY and updated != raw:
              README.write_text(updated, encoding="utf-8", newline="\n")
              git("add", "--", "README.md")
              staged = git("diff", "--cached", "--name-only")
              print("staged:", staged)
              git("-c", "user.name=github-actions[bot]",
                  "-c", "user.email=41898282+github-actions[bot]@users.noreply.github.com",
                  "commit", "-m", "docs: update README TODO list for dev changes",
                  "-m", "Apply TODO removals and line updates from main-to-dev code changes.")
              sha = git("rev-parse", "HEAD")
              print("committed", sha)
              git("push", "origin", f"{sha}:refs/heads/dev")
              print("pushed", sha)
          elif APPLY:
              print("No README change required.")
          else:
              (ROOT / "README.proposed.md").write_text(updated, encoding="utf-8", newline="\n")
              print("Dry run only; wrote README.proposed.md")
          PY
          python /tmp/sync_todo_readme.py
